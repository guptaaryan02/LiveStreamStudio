name: Build & Release

# Push a tag to publish:   git tag v1.0.1 && git push origin v1.0.1
# Or run manually from the Actions tab to get installers without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is deliberately NOT built here. Private-repo macOS runners bill
        # at 10x, so the .dmg is built locally with `npm run tauri:build` and
        # attached to the release with:
        #   gh release upload v1.0.1 "src-tauri/target/release/bundle/dmg/"*.dmg
        include:
          - platform: ubuntu-22.04
            label: Linux
          - platform: windows-latest
            label: Windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust builds dominate the runtime; cache them per platform.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            file

      - name: Install npm dependencies
        run: npm ci

      # Bundles a GPL FFmpeg build into the installer so users need nothing
      # preinstalled. Pin FFMPEG_RELEASE to a dated BtbN build for reproducible
      # releases instead of the moving 'latest' tag.
      - name: Bundle FFmpeg
        shell: bash
        env:
          FFMPEG_RELEASE: ${{ vars.FFMPEG_RELEASE || 'latest' }}
        run: bash scripts/fetch-ffmpeg.sh

      - name: Build the app
        run: npm run tauri:build

      # Unsigned builds: macOS shows Gatekeeper's "damaged / unidentified
      # developer" prompt and Windows shows SmartScreen. See the README for the
      # instructions users need.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  # Installers are published to the PUBLIC downloads repo, because release
  # assets on a private repo require a GitHub login to download.
  # Needs a secret named RELEASES_TOKEN: a personal access token with
  # Contents: read & write on guptaaryan02/LiveStreamStudio-releases.
  release:
    name: Publish to public downloads repo
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what will be published
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          repository: guptaaryan02/LiveStreamStudio-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # The tag lives in the private repo, so tell GitHub which commit to
          # hang the new tag on in the public one.
          target_commitish: main
          draft: true
          files: artifacts/**/*
          body: |
            ## Installers

            | Platform | File |
            |---|---|
            | Windows | `.exe` (installer) or `.msi` |
            | Linux | `.AppImage` or `.deb` |
            | macOS | `.dmg` — built separately and attached to this release |

            ### These builds are not code-signed

            **macOS** — the first launch is blocked. Right-click the app and
            choose *Open*, then confirm. If macOS says the app is "damaged",
            run:

                xattr -dr com.apple.quarantine "/Applications/LiveStream Studio.app"

            **Windows** — SmartScreen shows a blue warning. Choose
            *More info* → *Run anyway*.

            ### FFmpeg

            Windows and Linux builds bundle FFmpeg (GPL, includes libx264).
            The corresponding source and licence notices are described in the
            app's `resources/licenses` folder.
