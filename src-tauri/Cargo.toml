[package]
name = "livestream-studio"
version = "0.1.0"
description = "Tauri desktop studio for reliable multi-destination 24/7 livestream playout."
authors = ["LiveStream Studio"]
license = "LicenseRef-Proprietary"
publish = false
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
rfd = "0.15"
sysinfo = "0.36.1"
keyring = "3.6.3"
